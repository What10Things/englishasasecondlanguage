name: Diagnose EFL DNS routing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dns-diagnostic.yml
      - .github/scripts/dns_diagnostic.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare domain and hosting addresses
        id: dns
        continue-on-error: true
        run: python .github/scripts/dns_diagnostic.py

      - name: Publish DNS result
        if: always()
        uses: actions/github-script@v7
        env:
          DNS_STATE: ${{ steps.dns.outputs.state }}
          DNS_MESSAGE: ${{ steps.dns.outputs.message }}
        with:
          script: |
            const state = process.env.DNS_STATE === 'success' ? 'success' : 'failure';
            const message = (process.env.DNS_MESSAGE || 'DNS diagnostic returned no result').slice(0, 135);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: message,
              context: `dns/${message.replaceAll('/', '-').slice(0, 80)}`
            });

      - name: Fail on DNS mismatch
        if: always() && steps.dns.outputs.state != 'success'
        run: exit 1
