name: Diagnose all EFL DNS records

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-dns-diagnostic.yml
      - .github/scripts/full_dns_diagnostic.sh
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dns
        run: bash .github/scripts/full_dns_diagnostic.sh
      - uses: actions/github-script@v7
        env:
          DNS_MESSAGE: ${{ steps.dns.outputs.message }}
        with:
          script: |
            const message = (process.env.DNS_MESSAGE || 'No DNS result').slice(0, 135);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: message,
              context: `dns-full/${message.slice(0,70)}`
            });
