name: Diagnose EFL server handler

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/server_handler_diagnostic.py
      - .github/workflows/server-handler-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect live handler and cache headers
        run: python .github/scripts/server_handler_diagnostic.py

      - name: Publish server handler results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('/tmp/server-handler-results.json', 'utf8'));
            for (const [path, result] of Object.entries(results)) {
              const identity = result.what10things ? 'What10Things' : (result.efl ? 'EFL' : 'unknown');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'success',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                description: `${path} HTTP ${result.status}; ${identity}`.slice(0, 140),
                context: `handler/${path.replaceAll('/', '-') || 'root'}/${identity}`,
              });
              const interesting = Object.entries(result.headers || {}).filter(([key]) =>
                /cache|age|via|passenger|powered|server|location|etag|last-modified|vary/.test(key)
              );
              for (const [key, value] of interesting.slice(0, 20)) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  state: 'success',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  description: `${path} ${key}: ${value}`.slice(0, 140),
                  context: `handler/${path.replaceAll('/', '-') || 'root'}/${key}/${String(value).replaceAll('/', '-').slice(0, 55)}`,
                });
              }
            }
