name: Test and deploy EFL by Level to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: efl-by-level-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct production source
        run: |
          cat release/site-bundle.part* > /tmp/efl-site-bundle.tar.gz.b64
          base64 --decode /tmp/efl-site-bundle.tar.gz.b64 > /tmp/efl-site-bundle.tar.gz
          tar -xzf /tmp/efl-site-bundle.tar.gz
          test -f godaddy/index.php
          test -f tests/smoke.php

      - name: Lint PHP
        run: find godaddy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: |
          node --check godaddy/assets/js/site.js
          node --check godaddy/assets/js/level-test.js

      - name: Run route smoke tests
        run: |
          php -S 127.0.0.1:8099 -t godaddy tests/router.php > /tmp/efl-php.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          SMOKE_BASE=http://127.0.0.1:8099 php tests/smoke.php

      - name: Validate deployment secrets
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=()
          [[ -n "$FTP_USERNAME" ]] || missing+=(FTP_USERNAME)
          [[ -n "$FTP_PASSWORD" ]] || missing+=(FTP_PASSWORD)
          [[ -n "$FTP_SERVER_DIR" ]] || missing+=(FTP_SERVER_DIR)
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Report deployment started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Replacing legacy site and deploying EFL by Level',
              context: 'deployment/godaddy'
            });

      - name: Remove legacy website files
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python .github/scripts/clean_remote_site.py

      - name: Deploy website using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: englishasaforeignlanguage.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./godaddy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-efl-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/storage/leads.csv

      - name: Verify live site
        run: |
          python - <<'PY'
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          checks = {
              '/': ('English that meets you', 'Two clear journeys'),
              '/english-level-test/': ('24 short questions', 'Find your starting point'),
              '/learn-english/a1/': ('A1', 'Core grammar'),
              '/teach-english/': ('Ready-made resources', 'Teacher hub'),
          }
          last_error = ''
          for attempt in range(1, 13):
              failures = []
              for path, phrases in checks.items():
                  try:
                      req = Request(
                          f'https://englishasaforeignlanguage.com{path}?deploy={int(time.time())}',
                          headers={
                              'User-Agent': 'EFL-deployment-check/1.0',
                              'Cache-Control': 'no-cache',
                              'Pragma': 'no-cache',
                          },
                      )
                      with urlopen(req, timeout=20) as response:
                          html = response.read().decode('utf-8', errors='replace')
                      missing = [phrase for phrase in phrases if phrase not in html]
                      if missing:
                          failures.append(f'{path}: missing {missing}')
                  except (HTTPError, URLError, TimeoutError, OSError) as exc:
                      failures.append(f'{path}: {exc}')
              if not failures:
                  print('Live site verified')
                  break
              last_error = '; '.join(failures)
              if attempt == 12:
                  raise SystemExit(f'Live verification failed: {last_error}')
              print(f'Attempt {attempt} failed: {last_error}; retrying in 5 seconds')
              time.sleep(5)
          PY

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: succeeded ? 'GoDaddy deployment completed' : 'GoDaddy deployment failed',
              context: 'deployment/godaddy'
            });
