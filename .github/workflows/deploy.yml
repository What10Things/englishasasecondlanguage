name: Build and deploy EFL Flask app to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  statuses: write

concurrency:
  group: efl-by-level-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: flask_app/requirements.txt

      - name: Install Flask build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r flask_app/requirements.txt

      - name: Reconstruct the existing EFL site
        run: |
          mkdir -p /tmp/efl-legacy
          cat release/site-bundle.part* > /tmp/efl-site-bundle.tar.gz.b64
          base64 --decode /tmp/efl-site-bundle.tar.gz.b64 > /tmp/efl-site-bundle.tar.gz
          tar -xzf /tmp/efl-site-bundle.tar.gz -C /tmp/efl-legacy
          test -f /tmp/efl-legacy/godaddy/index.php
          test -f /tmp/efl-legacy/tests/router.php

      - name: Generate the Flask production application
        run: |
          python flask_app/build_from_legacy.py \
            --legacy-root /tmp/efl-legacy/godaddy \
            --router /tmp/efl-legacy/tests/router.php \
            --output deploy

          cp flask_app/app.py deploy/app.py
          cp flask_app/passenger_wsgi.py deploy/passenger_wsgi.py
          cp flask_app/requirements.txt deploy/requirements.txt
          cp flask_app/validate.py deploy/validate.py
          cp flask_app/test_learning.py deploy/test_learning.py
          cp flask_app/test_factory_sales.py deploy/test_factory_sales.py
          cp flask_app/browser_learning.py deploy/browser_learning.py

          mkdir -p deploy/tmp deploy/storage
          date -u +'%Y-%m-%dT%H:%M:%SZ' > deploy/tmp/restart.txt

          cat > deploy/.htaccess <<'HTACCESS'
          # DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN
          PassengerAppRoot "/home/uak0tydpqj02/public_html/englishasaforeignlanguage.com"
          PassengerBaseURI "/"
          PassengerPython "/home/uak0tydpqj02/virtualenv/flask_app/3.11/bin/python"
          PassengerAppLogFile "/home/uak0tydpqj02/efl-passenger.log"
          # DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END

          Options -Indexes
          <FilesMatch "\.(py|pyc)$">
            Require all denied
          </FilesMatch>
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>
          HTACCESS

          test -f deploy/page_manifest.json
          test -f deploy/pages/$(python - <<'PY'
          import json
          print(json.load(open('deploy/page_manifest.json'))['/'])
          PY
          )

      - name: Validate Flask application
        run: |
          python -m py_compile deploy/app.py deploy/passenger_wsgi.py
          (cd deploy && python validate.py && python test_learning.py && python test_factory_sales.py)
          node --check deploy/learning/assets/language.js
          node --check deploy/assets/js/site.js
          node --check deploy/assets/js/level-test.js

      - name: Browser customer journey gate
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk
          (cd deploy && python browser_learning.py)

      - name: Preserve product and browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efl-resource-verification
          path: |
            deploy/private_products/build-report.json
            deploy/browser-evidence/
          retention-days: 14

      - name: Validate deployment secrets
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=()
          [[ -n "$FTP_USERNAME" ]] || missing+=(FTP_USERNAME)
          [[ -n "$FTP_PASSWORD" ]] || missing+=(FTP_PASSWORD)
          [[ -n "$FTP_SERVER_DIR" ]] || missing+=(FTP_SERVER_DIR)
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Report Flask deployment started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Building and deploying the EFL Flask application',
              context: 'deployment/godaddy'
            });

      - name: Remove the previous PHP runtime
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python flask_app/remote_deploy.py prepare

      - name: Deploy Flask application using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: englishasaforeignlanguage.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-efl-flask-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/__pycache__/**
            **/*.pyc
            **/storage/submissions.csv
            **/storage/.secret_key
            **/storage/.last_retention_prune
            **/browser-evidence/**
            **/storage/factory_products/**
            **/stripe_acceptance.py
            **/test_factory_sales.py
            **/test_learning.py
            **/browser_learning.py

      - name: Force Passenger configuration and restart
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python flask_app/remote_deploy.py force --local-root deploy

      - name: Verify live Flask routes
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          page_checks = {
              '/en/': ('data-privacy-banner', 'href="/en/'),
              '/fr/resources/': ('Boutique', 'href="/fr/resources/a1-practice-v2/'),
              '/pl/practice/a1/': ('Prawidłowa odpowiedź', 'data-first-visit="false"'),
              '/ur/practice/a1/': ('dir="rtl"', 'data-privacy-open'),
              '/': ('English that meets you', 'Take the free level test', 'Get the free starter pack'),
              '/english-level-test/': ('24 short questions', 'Find your starting point'),
              '/learn-english/a1/': ('Core grammar',),
              '/teach-english/': ('Ready-made resources', 'Find what your lesson needs'),
              '/resources/?lang=fr': ('Boutique', 'a1-practice-v2'),
              '/practice/c2/?lang=pl': ('Prawidłowa odpowiedź',),
              '/study/?lang=es': ('Aprende inglés a tu nivel',),
              '/practice/a1/?lang=hi': ('सही उत्तर',),
              '/practice/b1/?lang=ur': ('درست جواب', 'dir="rtl"'),
              '/practice/c2/?lang=ps': ('سم ځواب', 'dir="rtl"'),
              '/resources/?lang=zh-Hans': ('语法与精准表达练习包',),
              '/resources/?lang=zh-Hant': ('文法與精準表達練習包',),
          }
          last_error = ''
          for attempt in range(1, 26):
              failures = []
              try:
                  health_request = Request(
                      f'https://englishasaforeignlanguage.com/health?deploy={int(time.time())}',
                      headers={'Cache-Control': 'no-cache', 'User-Agent': 'EFL-Flask-check/1.0'},
                  )
                  with urlopen(health_request, timeout=20) as response:
                      health = json.load(response)
                      runtime_header = response.headers.get('X-EFL-Runtime')
                  if health.get('runtime') != 'flask' or runtime_header != 'Flask':
                      failures.append(f'health runtime={health.get("runtime")}, header={runtime_header}')
              except (HTTPError, URLError, TimeoutError, OSError, ValueError) as exc:
                  failures.append(f'health: {exc}')

              for path, phrases in page_checks.items():
                  try:
                      request = Request(
                          f'https://englishasaforeignlanguage.com{path}{"&" if "?" in path else "?"}deploy={int(time.time())}',
                          headers={
                              'Cache-Control': 'no-cache, no-store, max-age=0',
                              'Pragma': 'no-cache',
                              'User-Agent': 'EFL-Flask-check/1.0',
                          },
                      )
                      with urlopen(request, timeout=20) as response:
                          html = response.read().decode('utf-8', errors='replace')
                          runtime_header = response.headers.get('X-EFL-Runtime')
                      missing = [phrase for phrase in phrases if phrase not in html]
                      if missing or runtime_header != 'Flask':
                          failures.append(f'{path}: missing={missing}, runtime={runtime_header}')
                  except (HTTPError, URLError, TimeoutError, OSError) as exc:
                      failures.append(f'{path}: {exc}')

              for private_path in ('/private_products/a1-practice-v1.zip', '/learning/bank.py', '/storage/.secret_key', '/purchase/download/?session_id=forged'):
                  try:
                      with urlopen(Request('https://englishasaforeignlanguage.com' + private_path), timeout=20) as response:
                          failures.append(f'Private resource exposed: {private_path}: {response.status}')
                  except HTTPError as exc:
                      if exc.code not in (403, 404):
                          failures.append(f'Private resource unexpected status: {private_path}: {exc.code}')
                  except (URLError, TimeoutError, OSError) as exc:
                      failures.append(f'Private resource verification unavailable: {private_path}: {exc}')

              if not failures:
                  print('Live Flask application verified; private files and unpaid downloads denied')
                  break
              last_error = '; '.join(failures)
              if attempt == 25:
                  raise SystemExit(f'Live Flask verification failed: {last_error}')
              print(f'Attempt {attempt} failed: {last_error}; retrying in 8 seconds')
              time.sleep(8)
          PY

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: succeeded ? 'EFL Flask deployment completed' : 'EFL Flask deployment failed',
              context: 'deployment/godaddy'
            });
