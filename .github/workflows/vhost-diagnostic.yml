name: Diagnose EFL Apache virtual host

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/vhost_diagnostic.py
      - .github/workflows/vhost-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect HTTP, HTTPS and certificate routing
        run: python .github/scripts/vhost_diagnostic.py

      - name: Publish routing results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('/tmp/vhost-results.json', 'utf8'));
            const checks = [
              ['https-root', results['https:/']],
              ['https-index-php', results['https:/index.php']],
              ['https-marker', results['https:/.deploy-root-check-943f6e8c3336c63b07747c4418e29e4e465798f6.txt']],
              ['http-root', results['http:/']],
              ['http-index-php', results['http:/index.php']],
            ];
            for (const [name, result] of checks) {
              const description = result.error
                ? `${name}: ${result.error}`
                : `${name}: HTTP ${result.status}; ${result.identity || result.location || 'no identity'}`;
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'success',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                description: description.slice(0, 140),
                context: `vhost/${name}`,
              });
            }
            const cert = results.certificate || {};
            const certDescription = cert.error ? `certificate: ${cert.error}` : `certificate SAN: ${(cert.sans || []).join(', ')}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: certDescription.slice(0, 140),
              context: 'vhost/certificate',
            });
