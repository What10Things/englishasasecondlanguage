name: Diagnose live EFL response

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/live-diagnostic.yml
      - .github/scripts/live_diagnostic.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect live pages
        id: live
        continue-on-error: true
        run: python .github/scripts/live_diagnostic.py

      - name: Publish live diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          LIVE_STATE: ${{ steps.live.outputs.state }}
          LIVE_MESSAGE: ${{ steps.live.outputs.message }}
        with:
          script: |
            const state = process.env.LIVE_STATE === 'success' ? 'success' : 'failure';
            const message = (process.env.LIVE_MESSAGE || 'Live diagnostic returned no result').slice(0, 135);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: message,
              context: `live/${message.replaceAll('/', '-').slice(0, 80)}`
            });

      - name: Fail when live response is wrong
        if: always() && steps.live.outputs.state != 'success'
        run: exit 1
