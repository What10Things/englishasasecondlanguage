name: Diagnose GoDaddy FTPS connection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ftp-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Test FTPS settings
        id: diagnose
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set +e
          state=failure
          message='Unknown FTPS diagnostic failure'

          if [[ -z "$FTP_SERVER" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" || -z "$FTP_SERVER_DIR" ]]; then
            message='One or more required FTP secrets are missing'
          elif [[ "$FTP_SERVER" == *://* || "$FTP_SERVER" == */* ]]; then
            message='FTP_SERVER must be a hostname only, with no protocol or path'
          else
            python - "$FTP_SERVER" <<'PY'
          import socket, sys
          host = sys.argv[1]
          try:
              socket.getaddrinfo(host, 21)
              with socket.create_connection((host, 21), timeout=15):
                  pass
          except Exception as exc:
              print(f'Connection check failed: {type(exc).__name__}')
              raise SystemExit(1)
          PY
            socket_status=$?
            if (( socket_status != 0 )); then
              message='FTP_SERVER could not be reached on port 21'
            else
              root_error=$(mktemp)
              curl --silent --show-error --fail --ssl-reqd --ftp-pasv \
                --connect-timeout 20 --max-time 45 \
                --user "$FTP_USERNAME:$FTP_PASSWORD" \
                --list-only "ftp://$FTP_SERVER/" \
                --output /dev/null 2>"$root_error"
              root_status=$?

              if (( root_status != 0 )); then
                if grep -qiE '530|login|authentication|access denied' "$root_error"; then
                  message='FTP username or password was rejected by GoDaddy'
                elif grep -qiE 'SSL|TLS|certificate' "$root_error"; then
                  message='GoDaddy FTPS/TLS connection could not be established'
                else
                  message="FTPS root connection failed with curl code $root_status"
                fi
              else
                target="$FTP_SERVER_DIR"
                target="${target#./}"
                target="${target#/}"
                target="${target%/}"

                if [[ -z "$target" || "$target" == '.' ]]; then
                  target_url="ftp://$FTP_SERVER/"
                else
                  target_url="ftp://$FTP_SERVER/$target/"
                fi

                dir_error=$(mktemp)
                curl --silent --show-error --fail --ssl-reqd --ftp-pasv \
                  --connect-timeout 20 --max-time 45 \
                  --user "$FTP_USERNAME:$FTP_PASSWORD" \
                  --list-only "$target_url" \
                  --output /dev/null 2>"$dir_error"
                dir_status=$?

                if (( dir_status != 0 )); then
                  message='FTP login works, but FTP_SERVER_DIR is not accessible'
                else
                  state=success
                  message='FTPS hostname, login and target directory are valid'
                fi
              fi
            fi
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "$message"

      - name: Publish diagnostic result
        if: always()
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_STATE: ${{ steps.diagnose.outputs.state }}
          DIAGNOSTIC_MESSAGE: ${{ steps.diagnose.outputs.message }}
        with:
          script: |
            const state = process.env.DIAGNOSTIC_STATE === 'success' ? 'success' : 'failure';
            const description = (process.env.DIAGNOSTIC_MESSAGE || 'FTPS diagnostic did not return a result').slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description,
              context: 'diagnostic/ftps'
            });

      - name: Fail when diagnostic failed
        if: always() && steps.diagnose.outputs.state != 'success'
        run: exit 1
