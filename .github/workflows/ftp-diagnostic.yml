name: Diagnose GoDaddy FTPS connection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ftp-diagnostic.yml
      - .github/scripts/ftp_diagnostic.py
      - .deploy/**
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test FTPS settings
        id: diagnose
        continue-on-error: true
        env:
          FTP_SERVER: englishasaforeignlanguage.com
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python .github/scripts/ftp_diagnostic.py

      - name: Publish diagnostic result
        if: always()
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_STATE: ${{ steps.diagnose.outputs.state }}
          DIAGNOSTIC_MESSAGE: ${{ steps.diagnose.outputs.message }}
        with:
          script: |
            const state = process.env.DIAGNOSTIC_STATE === 'success' ? 'success' : 'failure';
            const description = (process.env.DIAGNOSTIC_MESSAGE || 'FTPS diagnostic did not return a result').slice(0, 140);
            const diagnosticContext = `diagnostic/${description.replaceAll('/', '-').slice(0, 80)}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description,
              context: diagnosticContext
            });

      - name: Fail when diagnostic failed
        if: always() && steps.diagnose.outputs.state != 'success'
        run: exit 1
