name: Diagnose EFL htaccess routing

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/htaccess_diagnostic.py
      - .github/workflows/htaccess-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct packaged site
        run: |
          cat release/site-bundle.part* > /tmp/efl-site-bundle.tar.gz.b64
          base64 --decode /tmp/efl-site-bundle.tar.gz.b64 > /tmp/efl-site-bundle.tar.gz
          tar -xzf /tmp/efl-site-bundle.tar.gz

      - name: Compare remote and packaged htaccess
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python .github/scripts/htaccess_diagnostic.py

      - name: Publish htaccess rules
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('/tmp/htaccess-results.json', 'utf8'));
            const sets = [['remote', results.remote || []], ['local', results.local || []]];
            for (const [label, lines] of sets) {
              for (let i = 0; i < lines.length && i < 25; i++) {
                const line = String(lines[i]);
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  state: 'success',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  description: `${label} rule ${i + 1}: ${line}`.slice(0, 140),
                  context: `htaccess/${label}/${i + 1}/${line.replaceAll('/', '-').slice(0, 65)}`,
                });
              }
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: results.same ? 'Remote and packaged htaccess are identical' : 'Remote and packaged htaccess differ',
              context: `htaccess/compare/${results.same ? 'identical' : 'different'}`,
            });
