name: Inspect GoDaddy document root

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remote-inventory.yml
      - .github/scripts/remote_inventory.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List remote website files
        id: inventory
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python .github/scripts/remote_inventory.py

      - name: Publish inventory summary
        uses: actions/github-script@v7
        env:
          INVENTORY: ${{ steps.inventory.outputs.summary }}
        with:
          script: |
            const summary = (process.env.INVENTORY || 'No remote entries returned').slice(0, 130);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: summary,
              context: `inventory/${summary.slice(0, 80)}`
            });
