name: Inspect GoDaddy document root

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remote-inventory.yml
      - .github/scripts/remote_inventory.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List remote website files
        id: inventory
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python .github/scripts/remote_inventory.py

      - name: Publish inventory entries
        uses: actions/github-script@v7
        env:
          INVENTORY: ${{ steps.inventory.outputs.summary }}
        with:
          script: |
            const entries = (process.env.INVENTORY || '').split(', ').filter(Boolean);
            for (const entry of entries.slice(0, 40)) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'success',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                description: `Remote root contains ${entry}`.slice(0, 140),
                context: `inventory/${entry.slice(0, 90)}`,
              });
            }
