name: Claude EFL full audit and repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude-efl-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-efl-full-audit
  cancel-in-progress: false

jobs:
  audit-repair-test:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Check out EFL repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm Claude and Jev integration
        shell: bash
        run: |
          set -euo pipefail
          echo "Host: $(hostname)"
          echo "Claude: $(command -v claude || true)"
          claude --version
          echo "Configured Claude MCP integrations:"
          claude mcp list 2>/dev/null | sed -E 's#(token|key|secret|password)=?[^ ]*#\1=[REDACTED]#Ig' || true
          echo "Jev-related local configuration paths (names only):"
          find "$HOME" -maxdepth 4 -type f \( -iname '*jev*' -o -iname '.mcp.json' -o -iname 'CLAUDE.md' \) 2>/dev/null | head -n 80 || true

      - name: Run Claude Code site audit and implementation
        shell: bash
        env:
          CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
        run: |
          set -euo pipefail
          cat > /tmp/efl-claude-task.txt <<'PROMPT'
          You are the lead engineer for https://englishasaforeignlanguage.com/ and this repository.

          Mission: review the whole site and codebase, identify outstanding work, implement/fix everything that is safe and production-ready, test it thoroughly, and leave it ready for automatic deployment from main.

          Mandatory working method:
          1. USE SUBAGENTS. Delegate substantial parallel review work through Claude Code subagents/Task agents. At minimum cover:
             - UX/UI, accessibility, responsive/mobile behaviour, broken interactions and navigation.
             - Flask/backend, security, forms/data handling, reliability, performance and deployment compatibility.
             - SEO/technical SEO/content completeness, conversion/monetisation readiness, teacher-vs-learner journeys and automated-test gaps.
             Synthesize their findings before changing code.
          2. USE JEV. First inspect the Claude MCP/integration configuration and use the existing Jev integration as a decision-support layer. Ask Jev to help prioritise findings and/or choose the safest implementation approach. Do not merely mention Jev; actually invoke the configured Jev tool/integration if available. If the integration is genuinely unavailable or broken, diagnose it, document the exact blocker in the final report, and continue without inventing results.
          3. Inspect both the repository and the live site. Use the live site only for read-only checks. Do not alter external accounts, secrets, DNS, billing, or third-party services.
          4. Preserve the current Flask + GoDaddy/Passenger deployment architecture unless there is a clear defect. Do not add paid APIs, paid services, or new recurring costs. Prefer existing dependencies and zero-cost solutions.
          5. Preserve the product direction: learners get useful CEFR A1-C2 learning content and level-test journeys; teachers are the monetisation path through paid resources/packs/courses/newsletter. Improve obvious conversion or trust gaps where feasible without fabricating testimonials, claims, qualifications or products that do not exist.
          6. Fix concrete issues you find rather than just reporting them. Do not make speculative rewrites that risk regressions.
          7. Run the repository's existing build/validation/test commands and add targeted tests where important gaps are exposed. Exercise key Flask routes locally. Validate generated deployment output. Run syntax/static checks available in the repo.
          8. Do not reveal secrets in files, commits, logs or reports.

          Before finishing:
          - Create/update CLAUDE_EFL_REVIEW.md with: executive summary, findings grouped by severity, what was changed, tests run/results, any unresolved items, and explicit evidence that subagents and Jev were used (or Jev's exact blocker if unavailable).
          - Ensure git diff contains only intentional changes.
          - Do NOT deploy directly by FTP and do NOT edit GitHub Actions secrets. The wrapper will commit and push your repository changes to main; the existing deployment workflow will deploy and live-verify them.
          - If there is nothing material to change, still create CLAUDE_EFL_REVIEW.md explaining why.
          PROMPT

          claude -p "$(cat /tmp/efl-claude-task.txt)" --dangerously-skip-permissions

      - name: Commit and push Claude changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "claude-efl-auditor"
          git config user.email "actions@users.noreply.github.com"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "Claude produced no repository changes."
            exit 0
          fi
          git commit -m "Claude audit: repair and improve EFL site"
          git pull --rebase origin main
          git push origin HEAD:main
